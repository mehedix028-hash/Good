<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Good Morning ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    font-family:Arial,"Noto Sans Bengali",sans-serif;
    color:white;

    background:
    radial-gradient(circle at 50% 45%,rgba(180,0,0,.45),transparent 30%),
    linear-gradient(135deg,#000,#160000 35%,#430000 60%,#050000);
}

/* ================= INTRO ================= */

.intro{
    position:fixed;
    inset:0;
    z-index:100;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
    radial-gradient(circle,#560000,#180000 45%,#000 90%);

    animation:introOut 1s ease 4s forwards;
}

.intro-content{
    text-align:center;
    animation:introPulse 2s ease-in-out infinite alternate;
}

.intro-small{
    font-size:13px;
    letter-spacing:6px;
    color:#ffbaba;

    text-shadow:
    0 0 10px red,
    0 0 25px red;
}

.intro-title{
    margin-top:18px;

    font-size:clamp(40px,12vw,72px);
    font-weight:900;

    background:
    linear-gradient(
        90deg,
        #fff,
        #ff4444,
        #fff,
        #ff2222,
        #fff
    );

    background-size:300% 100%;
    background-clip:text;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    animation:gradientMove 2.5s linear infinite;

    filter:drop-shadow(0 0 18px red);
}

.intro-line{
    width:170px;
    height:2px;
    margin:22px auto;

    background:#ff2222;

    box-shadow:
    0 0 10px red,
    0 0 30px red;
}

@keyframes introPulse{
    from{
        transform:scale(.9);
        opacity:.7;
    }

    to{
        transform:scale(1.05);
        opacity:1;
    }
}

@keyframes gradientMove{
    from{
        background-position:0%;
    }

    to{
        background-position:300%;
    }
}

@keyframes introOut{
    0%{
        opacity:1;
        visibility:visible;
    }

    75%{
        opacity:0;
    }

    100%{
        opacity:0;
        visibility:hidden;
        pointer-events:none;
    }
}


/* ================= BACKGROUND ================= */

.glow{
    position:absolute;

    width:350px;
    height:350px;

    border-radius:50%;

    background:red;
    opacity:.13;

    filter:blur(100px);

    animation:glowMove 5s ease-in-out infinite alternate;
}

@keyframes glowMove{
    from{
        transform:scale(.7);
    }

    to{
        transform:scale(1.4);
    }
}

.ring{
    position:absolute;

    width:480px;
    height:480px;

    border-radius:50%;

    border:1px solid rgba(255,0,0,.25);

    box-shadow:
    0 0 60px rgba(255,0,0,.12);

    animation:ringRotate 15s linear infinite;
}

@keyframes ringRotate{
    to{
        transform:rotate(360deg);
    }
}


/* ================= HEARTS ================= */

.hearts{
    position:absolute;
    inset:0;

    overflow:hidden;
    pointer-events:none;
}

.heart{
    position:absolute;
    bottom:-70px;

    color:#ff3030;
    font-size:30px;

    text-shadow:
    0 0 10px red,
    0 0 25px red,
    0 0 45px rgba(255,0,0,.8);

    animation:heartUp 9s linear infinite;
}

.heart:nth-child(1){
    left:7%;
}

.heart:nth-child(2){
    left:22%;
    animation-delay:2s;
}

.heart:nth-child(3){
    left:40%;
    animation-delay:4s;
}

.heart:nth-child(4){
    left:59%;
    animation-delay:1s;
}

.heart:nth-child(5){
    left:77%;
    animation-delay:3s;
}

.heart:nth-child(6){
    left:91%;
    animation-delay:5s;
}

@keyframes heartUp{

    0%{
        transform:
        translateY(0)
        translateX(0)
        scale(.4)
        rotate(0);

        opacity:0;
    }

    15%{
        opacity:1;
    }

    50%{
        transform:
        translateY(-50vh)
        translateX(35px)
        scale(1)
        rotate(25deg);
    }

    100%{
        transform:
        translateY(-115vh)
        translateX(-40px)
        scale(1.5)
        rotate(-25deg);

        opacity:0;
    }
}


/* ================= PARTICLES ================= */

.particle{
    position:absolute;

    width:4px;
    height:4px;

    border-radius:50%;

    background:#ff3030;

    box-shadow:
    0 0 8px red,
    0 0 20px red;

    animation:twinkle 2s infinite alternate;
}

.p1{
    top:14%;
    left:12%;
}

.p2{
    top:23%;
    right:15%;
    animation-delay:.5s;
}

.p3{
    top:48%;
    left:7%;
    animation-delay:1s;
}

.p4{
    top:68%;
    right:8%;
    animation-delay:1.5s;
}

.p5{
    top:78%;
    left:20%;
    animation-delay:2s;
}

.p6{
    top:12%;
    right:35%;
    animation-delay:.8s;
}

@keyframes twinkle{

    from{
        opacity:.15;
        transform:scale(.5);
    }

    to{
        opacity:1;
        transform:scale(1.8);
    }
}


/* ================= MAIN CARD ================= */

.card-wrap{
    position:absolute;

    left:50%;
    top:50%;

    width:min(90%,520px);

    z-index:20;

    opacity:0;

    transform-style:preserve-3d;

    animation:
    cardEnter
    3s
    cubic-bezier(.16,1,.3,1)
    4s
    forwards;
}

@keyframes cardEnter{

    0%{
        opacity:0;

        transform:
        translate(-50%,-50%)
        translateZ(-900px)
        translateY(180px)
        scale(.2)
        rotateX(35deg)
        rotateY(-720deg)
        rotateZ(-15deg);
    }

    15%{
        opacity:1;
    }

    30%{
        transform:
        translate(-50%,-50%)
        translateZ(-500px)
        translateY(60px)
        scale(.5)
        rotateX(-20deg)
        rotateY(-540deg)
        rotateZ(12deg);
    }

    48%{
        transform:
        translate(-50%,-50%)
        translateZ(-220px)
        translateY(-25px)
        scale(.78)
        rotateX(15deg)
        rotateY(-300deg)
        rotateZ(-8deg);
    }

    68%{
        transform:
        translate(-50%,-50%)
        translateZ(80px)
        translateY(15px)
        scale(1.06)
        rotateX(-7deg)
        rotateY(-120deg)
        rotateZ(4deg);
    }

    84%{
        transform:
        translate(-50%,-50%)
        translateZ(40px)
        translateY(-5px)
        scale(.98)
        rotateX(4deg)
        rotateY(25deg)
        rotateZ(-2deg);
    }

    100%{
        opacity:1;

        transform:
        translate(-50%,-50%)
        translateZ(0)
        translateY(0)
        scale(1)
        rotateX(0)
        rotateY(0)
        rotateZ(0);
    }
}


/* ================= CARD ================= */

.card{
    padding:42px 24px;

    text-align:center;

    border-radius:35px;

    background:
    linear-gradient(
        145deg,
        rgba(255,255,255,.13),
        rgba(255,0,0,.08),
        rgba(0,0,0,.5)
    );

    border:1px solid rgba(255,70,70,.55);

    backdrop-filter:blur(18px);

    box-shadow:
    0 30px 100px rgba(0,0,0,.9),
    0 0 50px rgba(255,0,0,.22),
    inset 0 1px 2px rgba(255,255,255,.25);

    transform-style:preserve-3d;
}


/* ================= SUBTITLE ================= */

.subtitle{
    font-size:14px;
    letter-spacing:5px;

    color:#ffbaba;

    text-shadow:
    0 0 8px red,
    0 0 18px red;

    opacity:0;

    animation:
    subtitleIn
    1s
    ease
    6.8s
    forwards;
}

@keyframes subtitleIn{

    from{
        opacity:0;
        transform:
        translateY(25px)
        translateZ(-50px);
    }

    to{
        opacity:1;
        transform:
        translateY(0)
        translateZ(30px);
    }
}


/* ================= GOOD MORNING ================= */

.good{
    margin-top:10px;

    font-size:clamp(43px,11vw,76px);

    font-weight:900;
    line-height:1;

    background:
    linear-gradient(
        180deg,
        #fff 0%,
        #ffd5d5 25%,
        #ff4040 60%,
        #980000 100%
    );

    background-clip:text;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    text-shadow:
    2px 2px 0 #a00000,
    4px 4px 0 #680000,
    7px 8px 0 #3d0000,
    10px 14px 20px rgba(0,0,0,.9);

    opacity:0;

    animation:
    goodMorningSpin
    2.7s
    cubic-bezier(.16,1,.3,1)
    4.2s
    forwards;
}

@keyframes goodMorningSpin{

    0%{
        opacity:0;

        transform:
        translateZ(-600px)
        scale(.12)
        rotateX(90deg)
        rotateY(-720deg)
        rotateZ(-25deg);
    }

    20%{
        opacity:1;

        transform:
        translateZ(-300px)
        scale(.35)
        rotateX(-40deg)
        rotateY(-540deg)
        rotateZ(18deg);
    }

    42%{
        transform:
        translateZ(-20px)
        scale(.7)
        rotateX(20deg)
        rotateY(-300deg)
        rotateZ(-10deg);
    }

    65%{
        transform:
        translateZ(80px)
        scale(1.1)
        rotateX(-8deg)
        rotateY(-100deg)
        rotateZ(5deg);
    }

    82%{
        transform:
        translateZ(60px)
        scale(.97)
        rotateX(4deg)
        rotateY(25deg)
        rotateZ(-2deg);
    }

    100%{
        opacity:1;

        transform:
        translateZ(70px)
        scale(1)
        rotateX(0)
        rotateY(0)
        rotateZ(0);
    }
}


/* ================= RED LINE ================= */

.line{
    width:0;
    height:3px;

    margin:24px auto 15px;

    border-radius:10px;

    background:#ff3030;

    box-shadow:
    0 0 10px red,
    0 0 25px red,
    0 0 45px red;

    animation:
    lineShow
    1s
    ease
    6.9s
    forwards;
}

@keyframes lineShow{
    to{
        width:120px;
    }
}


/* ================= 💋❤️‍🩹 BOX ================= */

.love-box{
    margin:8px auto 20px;

    width:190px;

    padding:10px 18px;

    border:2px solid #ff3030;

    border-radius:18px;

    background:
    linear-gradient(
        135deg,
        rgba(255,0,0,.20),
        rgba(80,0,0,.30)
    );

    color:#fff;

    font-size:22px;
    font-weight:bold;

    letter-spacing:2px;

    text-align:center;

    box-shadow:
    0 0 10px #ff0000,
    0 0 25px rgba(255,0,0,.8),
    inset 0 0 15px rgba(255,0,0,.15);

    text-shadow:
    0 0 8px #fff,
    0 0 15px #ff3030;

    opacity:0;

    animation:
    loveBoxIn
    1s
    ease
    7.1s
    forwards;
}

@keyframes loveBoxIn{

    0%{
        opacity:0;
        transform:
        scale(.5)
        translateY(-15px);
    }

    70%{
        transform:scale(1.08);
    }

    100%{
        opacity:1;
        transform:scale(1);
    }
}


/* ================= MESSAGE ================= */

.message{
    font-size:20px;
    line-height:1.9;

    color:#fff;

    opacity:0;

    text-shadow:
    0 3px 7px #000,
    0 0 12px rgba(255,0,0,.25);

    animation:
    messageIn
    1.3s
    ease
    7.7s
    forwards;
}

@keyframes messageIn{

    from{
        opacity:0;

        transform:
        translateY(35px)
        translateZ(-80px);
    }

    to{
        opacity:1;

        transform:
        translateY(0)
        translateZ(30px);
    }
}


/* ================= CAPTION ================= */

.caption{
    margin-top:18px;

    padding:12px 15px;

    border-left:3px solid red;
    border-right:3px solid red;

    border-radius:12px;

    color:#ffd5d5;

    font-size:15px;
    line-height:1.8;

    background:rgba(255,0,0,.06);

    box-shadow:
    inset 0 0 20px rgba(255,0,0,.08);

    opacity:0;

    animation:
    captionIn
    1.2s
    ease
    8.2s
    forwards;
}

@keyframes captionIn{

    from{
        opacity:0;
        transform:
        scale(.8)
        translateY(20px);
    }

    to{
        opacity:1;
        transform:
        scale(1)
        translateY(0);
    }
}


/* ================= MOBILE ================= */

@media(max-width:500px){

    .card{
        padding:35px 18px;
    }

    .good{
        font-size:44px;
    }

    .message{
        font-size:18px;
    }

    .caption{
        font-size:14px;
    }

    .subtitle{
        font-size:11px;
        letter-spacing:3px;
    }

    .ring{
        width:350px;
        height:350px;
    }

    .love-box{
        width:180px;
        font-size:20px;
    }
}
</style>
</head>

<body>

<!-- INTRO -->
<div class="intro">

    <div class="intro-content">

        <div class="intro-small">
            A BEAUTIFUL MORNING
        </div>

        <div class="intro-title">
            ❤️ Wait For It...
        </div>

        <div class="intro-line"></div>

    </div>

</div>


<!-- BACKGROUND -->
<div class="glow"></div>
<div class="ring"></div>


<!-- PARTICLES -->
<div class="particle p1"></div>
<div class="particle p2"></div>
<div class="particle p3"></div>
<div class="particle p4"></div>
<div class="particle p5"></div>
<div class="particle p6"></div>


<!-- FLOATING HEARTS -->
<div class="hearts">

    <div class="heart">❤</div>
    <div class="heart">♡</div>
    <div class="heart">❤</div>
    <div class="heart">♡</div>
    <div class="heart">❤</div>
    <div class="heart">♡</div>

</div>


<!-- MAIN -->
<div class="card-wrap">

    <div class="card">

        <div class="subtitle">
            ✦ A NEW DAY • A NEW BEGINNING ✦
        </div>


        <div class="good">
            Good Morning
        </div>


        <div class="line"></div>


        <!-- LOVE BOX -->
        <div class="love-box">
            BOW💋❤️‍🩹
        </div>


        <div class="message">


            আজকের সকালটা হোক<br>

             হাসি খুশি আর আনন্দময়<br>

            আর পুরো দিনটা কাটুক<br>

            আনন্দ আর ভালো লাগায়।✨❤️

        </div>


        <div class="caption">

            I LOVE YOU SO MUCH BOW..💋🫂❤️‍🩹

        </div>

    </div>

</div>

</body>
</html>
